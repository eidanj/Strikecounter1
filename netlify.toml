# Strike Counter 1 — static site, no build step.
[build]
  publish = "."
  command = ""

# Always check for a newer version (Netlify uses ETags, so unchanged
# files are still answered instantly with "304 Not Modified").
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
